name: Emulator Smoke Test

# Real on-emulator verification: install the APK, launch the app, walk the
# new sections via deep links, capture screenshots + UI dumps + logcat.
# Artifacts are pulled back and reviewed visually.
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # [T-fork-proot] prepare_android_sandbox.sh now BUILDS the OpenMinis
      # proot fork from source (native-offload extension) — needs the NDK.
      - name: Ensure required SDK components (NDK / CMake)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0" > /dev/null || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare sandbox assets (Alpine rootfs + proot)
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Grant execute permission for gradlew
        run: chmod +x src/android/gradlew

      - name: Build debug APK
        working-directory: src/android
        run: ./gradlew assembleDebug -PemulatorAbi=x86_64 --stacktrace --no-daemon

      - name: Run emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: bash scripts/emulator_smoke.sh

      - name: Upload smoke-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-artifacts
          path: artifacts/
          if-no-files-found: warn
