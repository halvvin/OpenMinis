name: Android CI (debug APK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Ensure required SDK components (NDK / CMake)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0" > /dev/null || true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Public mirror ships provider-customization.properties.example only;
      # the build reads the real file when present, empty values otherwise.
      - name: Ensure provider customization exists
        run: |
          if [ ! -f app/provider-customization.properties ] && [ -f app/provider-customization.properties.example ]; then
            cp app/provider-customization.properties.example app/provider-customization.properties
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openminis-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
